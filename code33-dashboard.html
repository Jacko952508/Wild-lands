<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE33 Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#e8eef8;font:14px system-ui,-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.tag,.muted{color:#8ea0b8;font-size:12px}.hero,.card,.lab{background:#0d121a;border:1px solid #222b38;border-radius:16px}.hero{padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px}.v{font-size:21px;font-weight:650;margin-top:5px}.lab{height:220px;position:relative;overflow:hidden;margin-bottom:10px;background:linear-gradient(#0a1018,#111a26)}.occ{position:absolute;left:44%;width:14%;height:100%;background:#27303c}.obj,.pred{position:absolute;border-radius:50%}.obj{width:16px;height:16px;background:#edf4ff;box-shadow:0 0 18px #d9e8ff}.pred{width:13px;height:13px;border:2px solid #9fb0c8}.good{color:#78e08f}.bad{color:#ff7979}.bar{height:6px;background:#1c2633;margin-top:10px}.fill{height:100%;background:#dce8f7}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="w"><div class="top"><b>CODE33 / DEVELOPMENT LAB</b><span class="good">● LIVE</span></div><div class="hero"><div id="phase" class="muted">Loading…</div><h1>Developmental benchmark</h1><div class="muted">Hidden world → pixels → observation → prediction → private scoring</div></div><div class="lab"><div class="occ"></div><div id="obj" class="obj"></div><div id="pred" class="pred"></div></div><div class="grid"><div class="card">EPISODE<div class="v" id="ep">—</div></div><div class="card">TESTS<div class="v" id="tests">—</div></div><div class="card">MODEL ERROR<div class="v" id="model">—</div></div><div class="card">BASELINE<div class="v" id="base">—</div></div><div class="card">GAIN<div class="v" id="gain">—</div></div><div class="card">95% CI<div class="v" id="ci">—</div></div><div class="card">EXISTENCE<div class="v" id="exist">—</div></div><div class="card">EVIDENCE<div class="v" id="evidence">—</div></div></div><div class="card" style="margin-top:10px">LEARNED ACCELERATION <b id="alpha">—</b><div class="bar"><div class="fill" id="progress"></div></div><div id="freeze" class="muted" style="margin-top:8px"></div></div></div><script>const q=x=>document.getElementById(x),f=x=>x==null?"—":Number(x).toFixed(3);async function u(){try{let d=await fetch("/api").then(r=>r.json()),s=d.report;q("phase").textContent=s.phase.toUpperCase()+" · STEP "+s.step+"/24";q("ep").textContent=s.episode+"/180";q("tests").textContent=s.position.tests;q("model").textContent=f(s.position.modelError);q("base").textContent=f(s.position.baselineError);q("gain").textContent=f(s.position.gain);q("ci").textContent=s.position.gainCI95?f(s.position.gainCI95.low)+" → "+f(s.position.gainCI95.high):"—";q("exist").textContent=s.existence.accuracy==null?"—":(s.existence.accuracy*100).toFixed(1)+"%";q("alpha").textContent="x "+f(s.alpha.x)+" · y "+f(s.alpha.y);q("progress").style.width=Math.min(100,s.episode/180*100)+"%";q("freeze").textContent=s.frozenAt?"Learning frozen after training":"Learning phase";let e=q("evidence");e.textContent=s.position.tests<20?"INSUFFICIENT":s.position.supported?"SUPPORTED":"NOT SUPPORTED";e.className="v "+(s.position.supported?"good":s.position.tests>=20?"bad":"");let x=4+s.step/24*88,y=48+Math.sin((s.step+s.episode)*.45)*18;q("obj").style.left=x+"%";q("obj").style.top=y+"%";q("pred").style.left=Math.min(95,x+4+s.alpha.x)+"%";q("pred").style.top=Math.min(90,y+s.alpha.y)+"%"}catch(e){q("phase").textContent="Waiting for service…"}}u();setInterval(u,750)</script></body></html>
