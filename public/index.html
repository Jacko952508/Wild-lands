<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wildlands Immutable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="brand"><b>WILDLANDS</b><span>IMMUTABLE</span></div>
  <div class="centerHud"><div id="region">Loading world…</div><div id="compass">N</div></div>
  <div id="stats">—</div>
</div>

<div id="cross">+</div>
<div class="pad" id="move"><i></i></div>
<div class="pad" id="look"><i></i></div>
<button id="sprint">SPRINT</button>
<button id="use" class="hidden">USE</button>
<button id="map">MAP</button>
<button id="worldctl">WORLD</button>
<div id="flightControls" class="hidden"><button id="ascend">UP</button><button id="descend">DOWN</button></div>
<div id="worldPanel" class="hidden"><div class="worldHead"><b>WORLD CONTROLS</b><button id="worldClose">×</button></div><label>Time of day <input id="timeSlider" type="range" min="0" max="24" step="0.25" value="12"></label><div id="timeReadout">12:00</div><div class="weatherButtons"><button data-weather="clear">CLEAR</button><button data-weather="cloudy">CLOUDY</button><button data-weather="rain">RAIN</button><button data-weather="mist">MIST</button><button data-weather="storm">STORM</button></div><button id="autoTime">AUTO TIME: ON</button></div>

<div id="toast"></div>

<div id="panel" class="hidden">
  <div class="panelHead">
    <div><h2>Explored World</h2><p>Select a visited region to fast-travel.</p></div>
    <button id="close">×</button>
  </div>

  <div class="mapToolbar">
    <button id="mapN">N</button>
    <div><button id="mapW">W</button><button id="mapHome">YOU</button><button id="mapE">E</button></div>
    <button id="mapS">S</button>
  </div>

  <div id="mapgrid" aria-label="World map"></div>

  <div id="mapSelection">
    <div id="mapInfo">No region selected</div>
    <button id="travel" disabled>TRAVEL</button>
  </div>
</div>

<script src="three.min.js"></script>
<script src="engine.js"></script>
</body>
</html>
