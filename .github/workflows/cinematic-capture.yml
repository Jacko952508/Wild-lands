name: Wildlands Cinematic Capture
on:
  push:
    paths: ['.github/workflows/cinematic-capture.yml']
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install capture stack
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb chromium xdotool
      - name: Capture real Wildlands renderer
        shell: bash
        run: |
          set -euo pipefail
          (cd public && python3 -m http.server 8080 >/tmp/server.log 2>&1 &)
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          mkdir -p /tmp/chrome-profile/Default
          printf '{"browser":{"has_seen_welcome_page":true},"distribution":{"skip_first_run_ui":true,"import_bookmarks":false,"import_history":false,"import_search_engine":false}}' > /tmp/chrome-profile/Default/Preferences
          chromium --user-data-dir=/tmp/chrome-profile --no-first-run --no-default-browser-check --disable-fre --disable-search-engine-choice-screen --disable-features=SigninIntercept,ChromeWhatsNewUI --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --ignore-gpu-blocklist --window-size=1280,720 --window-position=0,0 --kiosk http://127.0.0.1:8080 >/tmp/chromium.log 2>&1 &
          CHROME_PID=$!
          sleep 6
          # If distro Chromium still shows a consent dialog, accept the focused default action automatically.
          xdotool key Return || true
          sleep 2
          xdotool key F11 || true
          sleep 2
          # Save a proof frame before recording so the artifact includes what was actually visible.
          ffmpeg -y -f x11grab -video_size 1280x720 -i :99.0 -frames:v 1 proof.png >/dev/null 2>&1
          timeout -s INT 28s ffmpeg -y -f x11grab -framerate 30 -video_size 1280x720 -i :99.0 -t 26 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart Wildlands-Cinematic-Preview.mp4 || true
          kill -9 "$CHROME_PID" 2>/dev/null || true
          pkill -9 chromium 2>/dev/null || true
          test -s Wildlands-Cinematic-Preview.mp4
          test -s proof.png
      - name: Validate MP4
        run: |
          set -e
          ffmpeg -v error -i Wildlands-Cinematic-Preview.mp4 -f null -
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 Wildlands-Cinematic-Preview.mp4)
          python3 -c "d=float('$D'); assert 20 < d < 30, d"
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlands-Cinematic-Preview
          path: |
            Wildlands-Cinematic-Preview.mp4
            proof.png
          if-no-files-found: error
          retention-days: 7
