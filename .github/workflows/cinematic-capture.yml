name: Wildlands Cinematic Capture
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb chromium
      - run: npm install playwright-core
      - name: Capture actual game
        run: |
          cat > capture.js <<'EOF'
          const {chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:false,executablePath:'/usr/bin/chromium',args:['--no-sandbox','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--window-size=1280,720']});const c=await b.newContext({viewport:{width:1280,height:720},recordVideo:{dir:'video',size:{width:1280,height:720}}});const p=await c.newPage();await p.goto('http://127.0.0.1:8080');await p.waitForTimeout(10000);await p.addStyleTag({content:'#hud,#topActions,#objectiveTracker,#vitals,#cross,.controlZone,#actionCluster,#equippedTool,#buildModeHud,#vehicleCard,#flightControls,.sidePanel,#panel,#missionBanner,#toast{display:none!important}'});await p.keyboard.down('w');for(let i=0;i<24;i++){await p.mouse.move(390+i*18,350-Math.sin(i/4)*40,{steps:12});await p.waitForTimeout(850)}await p.keyboard.up('w');await p.waitForTimeout(1800);await c.close();await b.close()})().catch(e=>{console.error(e);process.exit(1)})
          EOF
          (cd public && python3 -m http.server 8080 >/dev/null 2>&1 &)
          xvfb-run -a node capture.js
          SRC=$(find video -type f | head -1)
          test -n "$SRC"
          ffmpeg -y -i "$SRC" -c:v libx264 -crf 20 -pix_fmt yuv420p -movflags +faststart Wildlands-Cinematic-Preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlands-Cinematic-Preview
          path: Wildlands-Cinematic-Preview.mp4
