name: Wildlands Cinematic Capture
on:
  push:
    paths: ['.github/workflows/cinematic-capture.yml']
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install capture dependencies
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb chromium xdotool
      - name: Build capture-only game shell and record
        timeout-minutes: 2
        shell: bash
        run: |
          set -u
          # Replace only the Actions checkout HTML. The real game/repository build remains untouched.
          cat > public/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildlands Capture</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#game{display:block;width:100vw;height:100vh}</style></head><body><canvas id="game"></canvas><script src="three.min.js"></script><script src="engine.js"></script></body></html>
          HTML
          (cd public && python3 -m http.server 8080 >/tmp/server.log 2>&1 &) || true
          Xvfb :99 -screen 0 720x1280x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          mkdir -p /tmp/chrome-profile/Default
          touch '/tmp/chrome-profile/First Run'
          printf '{"browser":{"has_seen_welcome_page":true,"check_default_browser":false},"distribution":{"skip_first_run_ui":true}}' > /tmp/chrome-profile/Default/Preferences
          timeout 90s chromium --user-data-dir=/tmp/chrome-profile --no-first-run --no-default-browser-check --disable-search-engine-choice-screen --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-webgl --ignore-gpu-blocklist --window-size=720,1280 --window-position=0,0 --kiosk http://127.0.0.1:8080 >/tmp/chromium.log 2>&1 &
          sleep 38
          # The capture shell contains no HUD, buttons, panels or intro DOM. Give the renderer keyboard movement directly.
          xdotool mousemove 360 640 click 1 || true
          xdotool keydown w || true
          timeout 8s ffmpeg -y -f x11grab -video_size 720x1280 -i :99.0 -frames:v 1 proof.png >/dev/null 2>&1 || true
          timeout -k 3s -s INT 25s ffmpeg -y -f x11grab -framerate 30 -video_size 720x1280 -i :99.0 -t 22 -an -c:v libx264 -preset ultrafast -crf 21 -pix_fmt yuv420p -movflags +faststart Wildlands-Cinematic-Portrait.mp4 || true
          xdotool keyup w || true
          pkill -9 chromium || true
          pkill -9 ffmpeg || true
          test -s proof.png
          test -s Wildlands-Cinematic-Portrait.mp4
          timeout 10s ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Wildlands-Cinematic-Portrait.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Wildlands-Cinematic-Portrait
          path: |
            Wildlands-Cinematic-Portrait.mp4
            proof.png
          if-no-files-found: error
          retention-days: 7
