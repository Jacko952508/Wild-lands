name: Render Shuttle Movie
on:
  push:
    branches: [video-render-worker]
    paths:
      - 'render_worker/**'
      - '.github/workflows/render-shuttle.yml'
jobs:
  frames:
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - {start: 1, end: 24, id: a}
          - {start: 25, end: 48, id: b}
          - {start: 49, end: 72, id: c}
          - {start: 73, end: 96, id: d}
          - {start: 97, end: 120, id: e}
          - {start: 121, end: 144, id: f}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Render chunk
        env:
          START_FRAME: ${{ matrix.chunk.start }}
          END_FRAME: ${{ matrix.chunk.end }}
        run: |
          mkdir -p render_output
          blender -b -P render_worker/shuttle_movie.py
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.chunk.id }}
          path: render_output/frame_*.png
          retention-days: 1
  encode:
    needs: frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -framerate 24 -start_number 1 -i frames/frame_%04d.png -vf "scale=720:1280:flags=lanczos,format=yuv420p" -c:v libx264 -preset slow -crf 18 -movflags +faststart shuttle_takeoff.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_name,width,height,r_frame_rate -of json shuttle_takeoff.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shuttle-takeoff-movie
          path: shuttle_takeoff.mp4
          retention-days: 7
